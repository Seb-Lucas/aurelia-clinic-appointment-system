services:
  - type: web
    name: aurelia-clinic-appointment-system
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: Aurelia Private Clinic
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /tmp/aurelia-data/app.sqlite
      - key: DB_SEED_DEMO_DATA
        value: "false"
      - key: PORTFOLIO_DEMO_STANDALONE
        value: "true"
      - key: PORTFOLIO_DEMO_PASSWORD
        sync: false
      - key: PORTFOLIO_DOCTOR_DEMO_PASSWORD
        generateValue: true
      - key: PORTFOLIO_RECEPTION_DEMO_PASSWORD
        generateValue: true
      - key: SESSION_SECURE
        value: "true"
      - key: SESSION_SAME_SITE
        value: Lax
